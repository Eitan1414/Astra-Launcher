name: Build Astra Launcher v0.6 SOL Packages

on:
  push:
    branches: ["astra-v0.6-sol-packages"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-astra-v06:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Astra v0.6 branch
        uses: actions/checkout@v7

      - name: Build Wii U toolchain image
        run: docker build -t astra-launcher-builder .

      - name: Build Astra Launcher WPS
        run: docker run --rm -v "$PWD:/project" astra-launcher-builder make

      - name: Upload Astra Launcher v0.6 development build
        uses: actions/upload-artifact@v7
        with:
          name: AstraLauncher-v0.6-SOL-Packages-wps
          path: SolarLauncher.wps
          if-no-files-found: error
